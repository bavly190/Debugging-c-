<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CppDebug – C++ Debugging Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafafa;--panel:#fff;--bd:#e0e0e6;--tx:#1c1c22;--mu:#6b6b78;--ac:#4f6df5;--er:#d93a3a;--wa:#c98a00;--in:#2a8bd8;--ok:#1f9d5c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16161a;--panel:#1e1e24;--bd:#2f2f38;--tx:#e6e6ec;--mu:#8b8b98;--ac:#7b92ff;--er:#ff6b6b;--wa:#f0b429;--in:#5cb3ff;--ok:#4cd387}}
:root[data-theme=dark]{--bg:#16161a;--panel:#1e1e24;--bd:#2f2f38;--tx:#e6e6ec;--mu:#8b8b98;--ac:#7b92ff;--er:#ff6b6b;--wa:#f0b429;--in:#5cb3ff;--ok:#4cd387}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--panel);flex-wrap:wrap}
.logo{font-weight:700;margin-right:auto}.logo b{color:var(--ac)}
button,select{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:minmax(0,1fr);gap:10px;padding:10px;min-height:0}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(320px,75vh);overflow:auto}}
.pane{background:var(--panel);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;color:var(--mu)}
.ed{flex:1;display:flex;align-items:flex-start;min-height:0;overflow:auto;font:13px/20px "JetBrains Mono",Consolas,monospace}

pre{margin:4px 0;padding:6px 8px;border-radius:6px;background:var(--bg);overflow:auto;font:12px monospace}
.del{border-left:3px solid var(--er)}.add{border-left:3px solid var(--ok)}
.bar{height:4px;background:var(--bd)}#pb{height:100%;width:0;background:var(--ac);transition:width .1s}
.mu{color:var(--mu)}.set{position:relative}.set summary{list-style:none;cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;background:var(--panel)}.set summary::-webkit-details-marker{display:none}.set>div{position:absolute;right:0;top:115%;z-index:30;min-width:230px;padding:12px;display:grid;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.ed{position:relative}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=midnight]{color-scheme:dark;--bg:#0b1020;--panel:#121a30;--bd:#243052;--tx:#dfe6ff;--mu:#7f8bb3;--ac:#6ea8ff;--er:#ff6b81;--wa:#ffc35c;--in:#5cc8ff;--ok:#4ee3a0}
:root[data-theme=forest]{color-scheme:dark;--bg:#0e1812;--panel:#14231a;--bd:#26402f;--tx:#e3f1e7;--mu:#7fa08a;--ac:#4ade80;--er:#ff7a7a;--wa:#f5c542;--in:#5cc8ff;--ok:#4ade80}
:root[data-theme=rose]{color-scheme:light;--bg:#fdf6f4;--panel:#fff;--bd:#eadbd6;--tx:#2a1f1d;--mu:#8a7570;--ac:#e0506b;--er:#d62839;--wa:#c77d00;--in:#2b7fd1;--ok:#1f9d5c}
:root[data-theme=sand]{color-scheme:light;--bg:#f4efe3;--panel:#fffaf0;--bd:#e4d9c0;--tx:#2b2a26;--mu:#7a7566;--ac:#b5651d;--er:#c0392b;--wa:#b7791f;--in:#2c7a9b;--ok:#2f855a}
body{font-family:Inter,system-ui,-apple-system,sans-serif}
.logo{display:flex;align-items:center;gap:8px;font-size:15px}.logo i{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ac);color:#fff;font:700 12px monospace}
button,select{transition:border-color .15s,background .15s,transform .05s}button:active{transform:translateY(1px)}button.p:hover{filter:brightness(1.1)}
button:focus-visible,select:focus-visible,#code:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#code{caret-color:var(--ac)}::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
.pane{box-shadow:0 1px 3px rgba(0,0,0,.1)}.card{transition:background .15s}.card:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.card.error .tag{color:var(--er)}.card.warning .tag{color:var(--wa)}.card.info .tag{color:var(--in)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.sbar{display:flex;justify-content:space-between;padding:4px 12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
.fixed{border:1px solid var(--ok);border-radius:8px;padding:6px 10px;margin-bottom:8px;color:var(--ok);font-size:13px}
#toast{position:fixed;right:14px;bottom:14px;background:var(--ok);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}#toast.on{opacity:1;transform:none}#ac{position:absolute;z-index:5;min-width:250px;max-width:90%;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font:12px system-ui,sans-serif;overflow:hidden}#ac .i{padding:4px 10px;display:flex;gap:12px;justify-content:space-between;cursor:pointer}#ac .i.on{background:var(--ac);color:#fff}#ac .h{padding:3px 10px;color:var(--mu);border-top:1px solid var(--bd);font-size:11px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
footer{text-align:center;padding:8px 12px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--panel)}
</style></head><body>
<header><div class="logo"><i>{}</i><span>Cpp<b>Debug</b></span></div>
<input type="file" id="up" accept=".cpp,.cc,.cxx,.h,.hpp,.hh,.hxx" hidden>
<button onclick="up.click()">Upload file</button><button onclick="undo()" id="bu" disabled>Undo</button><button onclick="redo()" id="br" disabled>Redo</button>
<button onclick="dl()">Export</button><button onclick="resetAll()">Reset</button><details class="set"><summary>Settings</summary><div><label><input type="checkbox" id="acOn" checked> Autocomplete</label><label><input type="checkbox" id="snOn" checked> Snippets</label><label><input type="checkbox" id="pairOn" checked> Auto-close and auto-indent</label><label>C++ standard <select id="std"><option value="11">C++11</option><option value="14">C++14</option><option value="17" selected>C++17</option><option value="20">C++20</option><option value="23">C++23</option></select></label></div></details><label class="mu"><input type="checkbox" id="auto" checked> Auto-analyze</label><select id="theme" onchange="setTheme(this.value)" title="Theme"><option value="auto">Theme: Auto</option><option value="light">Light</option><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="forest">Forest</option><option value="rose">Rose</option><option value="sand">Sand</option></select>
<button class="p" id="go" onclick="analyze()">Analyze Code</button></header>
<div class="bar"><div id="pb"></div></div>
<main>
<section class="pane"><div class="ph"><span id="fn">untitled.cpp</span><span id="st" class="mu"></span></div>
<div class="ed" id="ed"><div id="gut">1</div><textarea id="code" spellcheck="false" placeholder="Paste or drop C++ code here…"></textarea></div><div class="sbar"><span id="pos">Ln 1, Col 1</span><span id="live"></span></div></section>
<section class="pane"><div class="ph"><span id="sum">No analysis yet</span>
<select id="flt" onchange="render()"><option value="all">All</option><option>error</option><option>warning</option><option>info</option></select></div>
<div id="res"><p class="mu">Click “Analyze Code”. This page runs a rule-based static analyzer in your browser, in chunks, so large files stay responsive. It does not compile code or call an AI model.</p></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let issues=[],sel=-1,hist=[],fut=[],orig=null,cancel=false;
const code=$('code');
function gut(){const ls=code.value.split('\n'),n=ls.length;let mx=0;for(const l of ls)if(l.length>mx)mx=l.length;$('gut').textContent=Array.from({length:n},(_,i)=>i+1).join('\n');code.style.height=(n*20+36)+'px';code.style.width=Math.max($('ed').clientWidth-52,mx*8+40)+'px'}
code.addEventListener('input',()=>{gut();$('st').textContent='● unsaved';if(orig===null)orig=code.value;});

['dragover','drop'].forEach(e=>document.addEventListener(e,ev=>{ev.preventDefault();if(e==='drop')load(ev.dataTransfer.files[0])}));
$('up').onchange=e=>load(e.target.files[0]);
function load(f){if(!f)return;if(!/\.(cpp|cc|cxx|h|hpp|hh|hxx)$/i.test(f.name)){alert('Unsupported file type.');return}
if(f.size>20e6){alert('File exceeds the 20 MB limit.');return}
f.text().then(t=>{code.value=t;orig=t;$('fn').textContent=f.name;$('st').textContent=t.split('\n').length+' lines';gut();hist=[];fut=[];issues=[];prevKeys=null;fixedLog=[];render();btn()})}
function th(){const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#16161a';r.dataset.theme=d?'light':'dark'}
// blank out comments and strings, keeping line structure
function strip(src){const L=src.split('\n'),out=[];let bc=false;
for(const l of L){let s='',i=0,q=null;while(i<l.length){const c=l[i],d=l[i+1];
if(bc){if(c==='*'&&d==='/'){bc=false;s+='  ';i+=2}else{s+=' ';i++}continue}
if(q){if(c==='\\'){s+='  ';i+=2;continue}if(c===q)q=null;s+=' ';i++;continue}
if(c==='/'&&d==='*'){bc=true;s+='  ';i+=2;continue}if(c==='/'&&d==='/'){break}
if(c==='"'||c==="'"){q=c;s+=' ';i++;continue}s+=c;i++}out.push(s)}return out}
const tick=()=>new Promise(r=>setTimeout(r,0));
let running=false,pending=false,prevKeys=null,fixedLog=[],autoT;
async function analyze(silent){if(running){pending=true;return}running=true;$('live').textContent='Analyzing…';
const selT=sel>=0&&issues[sel]?{t:issues[sel].title,l:issues[sel].line}:null;
try{await analyze0(silent)}finally{running=false}
if(code.value.trim()){const ls=code.value.split('\n'),keys=issues.map(i=>({t:i.title,l:i.line,k:i.title+'|'+(ls[i.line-1]||'').trim()}));
if(prevKeys){const gone=prevKeys.filter(o=>!keys.some(n=>n.t===o.t&&(n.k===o.k||n.l===o.l)));if(gone.length){fixedLog.push(...gone.map(g=>g.t));toast('✓ Resolved: '+gone[0].t+(gone.length>1?' +'+(gone.length-1)+' more':''))}}
prevKeys=keys}else{prevKeys=null;fixedLog=[]}
if(selT){const j=issues.findIndex(i=>i.title===selT.t&&i.line===selT.l),j2=j>=0?j:issues.findIndex(i=>i.title===selT.t);if(j2>=0)sel=j2}
render();$('live').textContent=$('auto').checked?'● live · up to date':'○ manual';
if(pending){pending=false;analyze(true)}}
async function analyze0(silent){
if(!code.value.trim()){if(!silent)alert('Nothing to analyze.');issues=[];return}
$('go').disabled=true;issues=[];sel=-1;const src=code.value,raw=src.split('\n'),L=strip(src),N=L.length;const add=(sev,line,col,title,why,fix)=>issues.push({sev,line,col,title,why,fix});
const stages=['Reading source','Checking brackets','Running line rules','Checking includes and memory'];
// stage 1: brackets
$('pb').style.width='10%';await tick();
const st=[],pr={')':'(',']':'[','}':'{'};
for(let i=0;i<N;i++){if(/^\s*#/.test(L[i]))continue;for(let j=0;j<L[i].length;j++){const c=L[i][j];
if('([{'.includes(c))st.push([c,i,j]);else if(pr[c]){const t=st.pop();if(!t||t[0]!==pr[c]){add('error',i+1,j+1,'Unmatched “'+c+'”','No matching opener was found for this closing bracket.');if(t)st.push(t)}}}}
for(const [c,i,j] of st)add('error',i+1,j+1,'Unclosed “'+c+'”','This opening bracket is never closed. Cascading errors later in the file often come from this.');
// stage 2: line rules in chunks
const CH=500;
for(let s=0;s<N;s+=CH){if(cancel)break;
for(let i=s;i<Math.min(N,s+CH);i++){const l=L[i],t=l.trim(),n=i+1;if(!t||t[0]==='#')continue;
let m;
if((m=/^(int|float|double|char|bool|long|short|unsigned)\s+([A-Za-z_]\w*)\s*;/.exec(t)))
add('warning',n,l.indexOf(m[2])+1,'Uninitialized variable “'+m[2]+'”','Reading a local variable before assigning it is undefined behavior.',{from:raw[i],to:raw[i].replace(/;\s*$/,' = '+(m[1]==='bool'?'false':m[1]==='char'?"'\\0'":'0')+';'),line:i,note:'Initializes to a zero value. Low risk, but confirm 0 is a sensible default.'});
if((m=/\bif\s*\(([^()=!<>]*[^=!<>])=([^=][^()]*)\)/.exec(l)))
add('warning',n,m.index+1,'Assignment inside condition','“=” assigns; “==” compares. This is usually a typo.',{from:raw[i],to:raw[i].replace(/(\bif\s*\([^()=!<>]*[^=!<>])=([^=])/,'$1==$2'),line:i,note:'Changes behavior: the condition now compares instead of assigning. Review before accepting.'});
if(/\bgets\s*\(/.test(l))add('error',n,l.search(/\bgets/)+1,'Unsafe function gets()','gets() cannot limit input length and was removed from C++14. It enables buffer overflows.');
if((m=/\b(strcpy|strcat|sprintf)\s*\(/.exec(l)))add('warning',n,m.index+1,'Unbounded '+m[1]+'()','No length check, so it can overflow the destination buffer. Prefer std::string, snprintf or strncpy with explicit bounds.');
if(/\bNULL\b/.test(l))add('info',n,l.search(/\bNULL\b/)+1,'Use nullptr instead of NULL','nullptr is type-safe in modern C++.',{from:raw[i],to:raw[i].replace(/\bNULL\b/g,'nullptr'),line:i,note:'Safe in C++11 and later.'});
if(/<=\s*[\w.\->]+\.(size|length)\(\)/.test(l)&&/\bfor\s*\(/.test(l))add('warning',n,l.search(/<=/)+1,'Possible off-by-one in loop','Looping with “<=” up to size() reads one element past the end.',{from:raw[i],to:raw[i].replace(/<=(\s*[\w.\->]+\.(size|length)\(\))/,'<$1'),line:i,note:'Changes loop bounds. Verify the loop was not intentionally inclusive.'});
if(/^\s*(int|float|double|char|bool|auto|std::\w+(<.*>)?|return|[A-Za-z_]\w*\s*=)[^;{}]*[\w)\]"']\s*$/.test(l)&&!/[,(&|+\-*\/<>:?]$/.test(t)&&!/^(public|private|protected|case|default)\b/.test(t)&&!/\)\s*(const)?\s*$/.test(t)){
const nx=(L.slice(i+1).find(x=>x.trim())||'').trim();if(!/^[.\-+*\/&|?:=<>,)\]]/.test(nx)&&!/^(\{|\()/.test(nx))
add('warning',n,l.length+1,'Possible missing semicolon','This statement-like line does not end with “;”. Heuristic only, so it is not a confirmed compiler error.',{from:raw[i],to:raw[i].replace(/\s*$/,';'),line:i,note:'Heuristic fix. Recompile to confirm.'})}}
$('pb').style.width=(20+60*Math.min(1,(s+CH)/N))+'%';$('sum').textContent='Analyzing… '+Math.min(N,s+CH)+'/'+N+' lines';await tick()}
// stage 3: file-level
const all=L.join('\n');
const inc=h=>new RegExp('#\\s*include\\s*<'+h+'>').test(src);
const need=[[/\bstd::(cout|cin|cerr)\b|\b(cout|cin)\s*(<<|>>)/,'iostream'],[/\bstd::vector\b|\bvector\s*</,'vector'],[/\bstd::string\b/,'string'],[/\bstd::(map|unordered_map)\b/,'map']];
for(const [re,h] of need){const m=re.exec(all);if(m&&!inc(h)&&!(h==='map'&&inc('unordered_map'))){const ln=all.slice(0,m.index).split('\n').length;
add('warning',ln,1,'Missing #include <'+h+'>','This file uses a symbol from <'+h+'> but never includes it. It may only compile by accident through another header.',{insert:'#include <'+h+'>',line:0,note:'Adds an include at the top of the file. Safe.'})}}
const nw=(all.match(/\bnew\b(?!\s*\()/g)||[]).length,dl=(all.match(/\bdelete\b/g)||[]).length;
if(nw>dl){const idx=all.search(/\bnew\b/);add('warning',all.slice(0,idx).split('\n').length,1,'Possible memory leak',nw+' uses of new vs '+dl+' delete in this file. Prefer std::unique_ptr or std::make_unique. Needs manual review, no automatic fix.')}
if(/using\s+namespace\s+std\s*;/.test(all))add('info',(all.slice(0,all.search(/using\s+namespace\s+std/)).split('\n').length),1,'using namespace std','Pulls every std name into scope and can cause name clashes, especially in headers.');
issues.sort((a,b)=>a.line-b.line);$('pb').style.width='100%';setTimeout(()=>$('pb').style.width='0',500);$('go').disabled=false;render()}
function render(){const f=$('flt').value,c={error:0,warning:0,info:0};issues.forEach(i=>c[i.sev]++);
$('sum').textContent=issues.length?issues.length+' issues · '+c.error+' errors · '+c.warning+' warnings · '+c.info+' info':'No issues found by these rules (this does not prove the code is correct)';
const r=$('res');r.innerHTML='';if(fixedLog.length){const dt=document.createElement('details');dt.className='fixed';const sm=document.createElement('summary');sm.textContent='✓ '+fixedLog.length+' resolved this session';dt.appendChild(sm);fixedLog.forEach(t=>{const p=document.createElement('div');p.className='mu';p.textContent='• '+t;dt.appendChild(p)});r.appendChild(dt)}issues.forEach((it,k)=>{if(f!=='all'&&it.sev!==f)return;const d=document.createElement('div');d.className='card '+it.sev+(k===sel?' sel':'');
d.innerHTML='<div class="tag">'+it.sev+' · line '+it.line+':'+it.col+'</div><b></b>';d.querySelector('b').textContent=it.title;
d.onclick=()=>{sel=k;goto(it);render()};
if(k===sel){const p=document.createElement('div');p.innerHTML='<p></p>';p.firstChild.textContent=it.why;d.appendChild(p);
if(it.fix){const x=it.fix,a=x.insert?'':x.from.trim(),b=x.insert||x.to.trim();
if(a){const o=document.createElement('pre');o.className='del';o.textContent='- '+a;d.appendChild(o)}
const w=document.createElement('pre');w.className='add';w.textContent='+ '+b;d.appendChild(w);
const n=document.createElement('p');n.className='mu';n.textContent='Impact: '+x.note;d.appendChild(n);
const bt=document.createElement('button');bt.className='p';bt.textContent='Fix this issue';bt.onclick=e=>{e.stopPropagation();apply([it])};d.appendChild(bt);if(/^Changes behavior/.test(x.note))exBlock(it,d)}
else{const n=document.createElement('p');n.className='mu';n.textContent='No safe automatic fix. This needs a decision from you.';d.appendChild(n);exBlock(it,d)}}
r.appendChild(d)});
const safe=issues.filter(i=>i.fix&&!/^Changes behavior/.test(i.fix.note));if(safe.length){const b=document.createElement('button');b.className='p';b.style.cssText='width:100%;margin-bottom:8px';b.textContent='Fix all safe issues ('+safe.length+')';b.onclick=()=>{if(confirm('Apply '+safe.length+' safe fixes? Behavior-changing fixes are skipped. You can undo afterwards.'))apply(safe)};r.prepend(b)}}
function goto(it){const ls=code.value.split('\n');let p=0;for(let i=0;i<it.line-1;i++)p+=ls[i].length+1;code.focus();code.setSelectionRange(p,p+(ls[it.line-1]||'').length);$('ed').scrollTop=Math.max(0,(it.line-4)*20)}
function apply(list){const ls=code.value.split('\n');hist.push(code.value);fut=[];
const ins=[];list.filter(i=>i.fix).sort((a,b)=>b.fix.line-a.fix.line).forEach(i=>{const x=i.fix;if(x.insert){if(!ins.includes(x.insert))ins.push(x.insert)}else if(ls[x.line]===x.from)ls[x.line]=x.to});
ins.forEach(h=>ls.unshift(h));code.value=ls.join('\n');gut();btn();$('st').textContent='● unsaved';analyze().then(()=>{$('sum').textContent='Re-analyzed after fix · '+$('sum').textContent})}
function undo(){if(!hist.length)return;fut.push(code.value);code.value=hist.pop();gut();btn();analyze()}
function redo(){if(!fut.length)return;hist.push(code.value);code.value=fut.pop();gut();btn();analyze()}
function resetAll(){if(code.value.trim()&&!confirm('Reset the workspace? This clears the code, results and undo history.'))return;cancel=true;setTimeout(()=>cancel=false,50);code.value='';orig=null;hist=[];fut=[];issues=[];prevKeys=null;fixedLog=[];sel=-1;$('flt').value='all';$('fn').textContent='untitled.cpp';$('st').textContent='';$('pb').style.width='0';$('go').disabled=false;$('up').value='';gut();btn();$('res').innerHTML='<p class="mu">Workspace reset. Paste or upload C++ code, then click “Analyze Code”.</p>';$('sum').textContent='No analysis yet'}
